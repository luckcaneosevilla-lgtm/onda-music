<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar administración · IVOX</title><link rel="stylesheet" href="/style.css"><script src="/recover.js" defer></script></head>
<body><main class="auth"><div class="logo">IV<span>≋</span>X</div><h1>Recupera tu acceso.</h1><p class="muted">Elige una contraseña nueva para tu cuenta. Al guardar entrarás al panel de administración.</p><form id="recovery-form"><label>Nueva contraseña<input id="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><label>Repetir contraseña<input id="confirmation" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><small>Al menos 12 caracteres. No tienes que compartirla con nadie.</small><button class="primary">Guardar y abrir administración</button></form><p id="result" role="status" aria-live="polite"></p><small>El enlace caduca a los 10 minutos y solo puede usarse una vez.</small></main></body></html>
