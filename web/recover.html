<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar administración · IVOX</title><link rel="stylesheet" href="/style.css"><script src="/recover.js" defer></script></head>
<body><main class="auth"><div class="logo"><svg class="logo-mark" viewBox="0 0 64 44" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9C20 2 44 2 58 8"/><path d="M4 20C18 8 46 8 60 20C46 31 18 31 4 20Z"/><circle cx="32" cy="19.5" r="6" fill="currentColor" stroke="none"/><path d="M27 28 24 41"/><path d="M38 28c4 8 12 11 18 7 3-3 0-6-3-4"/></svg>IVOX</div><h1>Recupera tu acceso.</h1><p class="muted">Elige una contraseña nueva para tu cuenta. Al guardar entrarás al panel de administración.</p><form id="recovery-form"><label>Nueva contraseña<input id="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><label>Repetir contraseña<input id="confirmation" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><small>Al menos 12 caracteres. No tienes que compartirla con nadie.</small><button class="primary">Guardar y abrir administración</button></form><p id="result" role="status" aria-live="polite"></p><small>El enlace caduca a los 10 minutos y solo puede usarse una vez.</small></main></body></html>
